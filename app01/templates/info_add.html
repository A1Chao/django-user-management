{% extends 'layout.html' %}

{% block title %}添加用户 - 用户管理系统{% endblock %}

{% block content %}
    <div class="page-header">
        <h2>添加用户
            <small>填写下面的信息并提交</small>
        </h2>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="panel panel-default">
                <div class="panel-heading">用户信息</div>
                <div class="panel-body">
                    <form method="post" action="/info/add/" class="form-horizontal">
                        {% csrf_token %}

                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="id_user">用户名</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="id_user" name="user"
                                       placeholder="请输入用户名" maxlength="32" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="id_pwd">密码</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="id_pwd" name="pwd"
                                       placeholder="请输入密码" maxlength="64" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label" for="id_age">年龄</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" id="id_age" name="age"
                                       placeholder="请输入年龄" min="0" max="150" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-sm-offset-3 col-sm-9">
                                <button type="submit" class="btn btn-primary">
                                    <span class="glyphicon glyphicon-ok"></span> 提交
                                </button>
                                <a href="/info/list/" class="btn btn-default">
                                    <span class="glyphicon glyphicon-arrow-left"></span> 返回列表
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
